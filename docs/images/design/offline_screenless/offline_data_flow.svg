<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010"><rect width="1200" height="1010" fill="white"/>
<text x="600" y="26.34" text-anchor="middle" font-family="Arial,sans-serif" font-size="26">PROPOSED POWER SUPPLY</text>
<rect x="20" y="50" width="260" height="80" fill="none" stroke="black" stroke-width="2.5"/>
<text x="150" y="83.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">Solar panel /</text>
<text x="150" y="113.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">charging circuit</text>
<rect x="320" y="50" width="260" height="80" fill="none" stroke="black" stroke-width="2.5"/>
<text x="450" y="83.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">Protected</text>
<text x="450" y="113.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">rechargeable battery</text>
<rect x="620" y="50" width="260" height="80" fill="none" stroke="black" stroke-width="2.5"/>
<text x="750" y="83.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">Voltage</text>
<text x="750" y="113.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">regulation</text>
<rect x="920" y="50" width="260" height="80" fill="none" stroke="black" stroke-width="2.5"/>
<text x="1050" y="83.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">Sensors and</text>
<text x="1050" y="113.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">ESP32 controller</text>
<polyline points="280,90 320,90" fill="none" stroke="black" stroke-width="2.5"/>
<polygon points="320,90 308,96 308,84" fill="black"/>
<polyline points="580,90 620,90" fill="none" stroke="black" stroke-width="2.5"/>
<polygon points="620,90 608,96 608,84" fill="black"/>
<polyline points="880,90 920,90" fill="none" stroke="black" stroke-width="2.5"/>
<polygon points="920,90 908,96 908,84" fill="black"/>
<text x="600" y="186.34" text-anchor="middle" font-family="Arial,sans-serif" font-size="26">SENSING AND DELAYED UPLOAD</text>
<rect x="20" y="220" width="360" height="95" fill="none" stroke="black" stroke-width="2.5"/>
<text x="200" y="261.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">Acquire, convert and</text>
<text x="200" y="290.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">calibrate readings</text>
<rect x="420" y="220" width="360" height="95" fill="none" stroke="black" stroke-width="2.5"/>
<text x="600" y="261.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">Assign record/sample IDs</text>
<text x="600" y="290.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">and time-quality status</text>
<rect x="820" y="220" width="360" height="95" fill="none" stroke="black" stroke-width="2.5"/>
<text x="1000" y="261.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">Commit pending record</text>
<text x="1000" y="290.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">to onboard flash</text>
<polyline points="380,267 420,267" fill="none" stroke="black" stroke-width="2.5"/>
<polygon points="420,267 408,273 408,261" fill="black"/>
<polyline points="780,267 820,267" fill="none" stroke="black" stroke-width="2.5"/>
<polygon points="820,267 808,273 808,261" fill="black"/>
<polyline points="1000,315 1000,380 600,380 600,420" fill="none" stroke="black" stroke-width="2.5"/>
<polygon points="600,420 594,408 606,408" fill="black"/>
<polygon points="600,420 800,510 600,600 400,510" fill="none" stroke="black" stroke-width="2.5"/>
<text x="600" y="489" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">Configured Wi-Fi</text>
<text x="600" y="518.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">connected and</text>
<text x="600" y="548" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">server reachable?</text>
<polyline points="800,510 870,510" fill="none" stroke="black" stroke-width="2.5"/>
<polygon points="870,510 858,516 858,504" fill="black"/>
<text x="835" y="495.82" text-anchor="middle" font-family="Arial,sans-serif" font-size="23">No</text>
<rect x="870" y="465" width="300" height="90" fill="none" stroke="black" stroke-width="2.5"/>
<text x="1020" y="504" text-anchor="middle" font-family="Arial,sans-serif" font-size="24">Keep records pending</text>
<text x="1020" y="532.32" text-anchor="middle" font-family="Arial,sans-serif" font-size="24">Reconnect and retry</text>
<polyline points="1020,555 1020,620 1190,620 1190,380 600,380 600,420" fill="none" stroke="black" stroke-width="2.5"/>
<polygon points="600,420 594,408 606,408" fill="black"/>
<polyline points="600,600 600,640 200,640 200,695" fill="none" stroke="black" stroke-width="2.5"/>
<polygon points="200,695 194,683 206,683" fill="black"/>
<text x="637.5" y="625.32" text-anchor="middle" font-family="Arial,sans-serif" font-size="23">Yes</text>
<rect x="20" y="695" width="360" height="100" fill="none" stroke="black" stroke-width="2.5"/>
<text x="200" y="738.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">Upload pending records</text>
<text x="200" y="768.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">using the same record IDs</text>
<rect x="420" y="695" width="360" height="100" fill="none" stroke="black" stroke-width="2.5"/>
<text x="600" y="724.84" text-anchor="middle" font-family="Arial,sans-serif" font-size="24">Server validates and saves</text>
<text x="600" y="753.16" text-anchor="middle" font-family="Arial,sans-serif" font-size="24">unique records; returns</text>
<text x="600" y="781.48" text-anchor="middle" font-family="Arial,sans-serif" font-size="24">acknowledgement</text>
<rect x="820" y="695" width="360" height="100" fill="none" stroke="black" stroke-width="2.5"/>
<text x="1000" y="738.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">Release acknowledged</text>
<text x="1000" y="768.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">records from local queue</text>
<polyline points="380,745 420,745" fill="none" stroke="black" stroke-width="2.5"/>
<polygon points="420,745 408,751 408,739" fill="black"/>
<polyline points="780,745 820,745" fill="none" stroke="black" stroke-width="2.5"/>
<polygon points="820,745 808,751 808,739" fill="black"/>
<text x="820.5" y="682.46" text-anchor="middle" font-family="Arial,sans-serif" font-size="19">Confirmed</text>
<rect x="20" y="850" width="360" height="90" fill="none" stroke="black" stroke-width="2.5"/>
<text x="200" y="889" text-anchor="middle" font-family="Arial,sans-serif" font-size="24">Storage full: keep pending</text>
<text x="200" y="917.32" text-anchor="middle" font-family="Arial,sans-serif" font-size="24">records; pause new logging</text>
<rect x="420" y="850" width="360" height="90" fill="none" stroke="black" stroke-width="2.5"/>
<text x="600" y="889" text-anchor="middle" font-family="Arial,sans-serif" font-size="24">Without acknowledgement:</text>
<text x="600" y="917.32" text-anchor="middle" font-family="Arial,sans-serif" font-size="24">retain records and retry</text>
<polyline points="600,795 600,850" fill="none" stroke="black" stroke-width="2.5"/>
<polygon points="600,850 594,838 606,838" fill="black"/>
<polyline points="780,895 1190,895 1190,380 600,380 600,420" fill="none" stroke="black" stroke-width="2.5"/>
<polygon points="600,420 594,408 606,408" fill="black"/>
<text x="600" y="977" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">Cloud uploads require internet access. The web dashboard displays uploaded records.</text>
<text x="600" y="1002.96" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">No dedicated OLED or LCD screen is fitted to the device.</text>
</svg>
